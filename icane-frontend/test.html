<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Camera Test</title>
<style>
  body { font-family: -apple-system, sans-serif; text-align: center; background: #111; color: #fff; padding: 40px 20px; }
  button { font-size: 22px; padding: 20px 40px; border-radius: 12px; border: none; background: #2ecc71; color: white; }
  #result { margin-top: 24px; font-size: 18px; white-space: pre-wrap; }
</style>
</head>
<body>

<button id="btn">Test Camera</button>
<div id="result">Not tested yet</div>

<script>
const btn = document.getElementById("btn");
const result = document.getElementById("result");

btn.addEventListener("click", async () => {
  result.textContent = "Requesting...";
  try {
    result.textContent += "\nisSecureContext: " + window.isSecureContext;
    result.textContent += "\nmediaDevices exists: " + !!navigator.mediaDevices;

    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    result.textContent += "\nSUCCESS - camera access granted";
    stream.getTracks().forEach(t => t.stop());
  } catch (err) {
    result.textContent += "\nERROR NAME: " + err.name;
    result.textContent += "\nERROR MESSAGE: " + err.message;
  }
});
</script>

</body>
</html>
