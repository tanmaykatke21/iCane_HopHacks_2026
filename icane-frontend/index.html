<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Walk-Assist Cane</title>
<style>
  body { font-family: -apple-system, sans-serif; text-align: center; background: #111; color: #fff; margin: 0; padding: 20px; touch-action: manipulation; min-height: 100vh; box-sizing: border-box; }
  video { width: 100%; max-width: 400px; border-radius: 12px; }
  button { font-size: 20px; padding: 16px 32px; margin-top: 20px; margin-right: 8px; border-radius: 12px; border: none; }
  #startBtn { background: #2ecc71; color: white; }
  #stopBtn { background: #e74c3c; color: white; }
  #detailBtn { background: #3498db; color: white; display: none; }
  #status { margin-top: 16px; font-size: 16px; color: #aaa; }
</style>
</head>
<body>

<video id="preview" autoplay playsinline muted></video>
<br />
<button id="startBtn">Start Monitoring</button>
<button id="stopBtn" style="display:none;">Stop</button>
<button id="detailBtn">Describe Surroundings</button>
<div id="status">Not started</div>
<div id="hint" style="margin-top: 8px; font-size: 13px; color: #666;">Tap anywhere to start. Once monitoring: shake the phone, or double-tap anywhere, for a full description</div>
<audio id="ttsAudio" style="display:none;"></audio>

<script>
const BASE_URL = "https://icane-hophacks-2026.onrender.com";
const CLASSIFY_URL = BASE_URL + "/classify";
const SPEAK_URL = BASE_URL + "/speak";
const DETAILED_URL = BASE_URL + "/describe-detailed";

// Floor between capture ticks. The loop no longer waits a fixed 2s
// regardless of how fast the backend responds — it captures again
// immediately after each response, only padded up to this floor if the
// round trip was faster than that (keeps it from hammering the API
// needlessly fast, while never adding idle wait on top of a slow response).
const MIN_LOOP_GAP_MS = 400;

// Smaller frames = faster upload + faster Gemini classification. 640px on
// the long edge is plenty of detail for "is there an obstacle ahead."
const LOOP_CAPTURE_MAX_DIM = 640;
// The on-demand button is a single tap, not a repeated poll, so it's worth
// spending a bit more time on a higher-res frame for a better description.
const DETAIL_CAPTURE_MAX_DIM = 1024;

// Hysteresis: speak the instant a hazard appears (safety first, no delay
// engaging), but require this many consecutive "clear" reads in a row
// before re-arming — so a single flickery misclassified frame in the
// middle of a real hazard can't cause a spurious repeat or an early drop.
const DISENGAGE_THRESHOLD = 2;

const video = document.getElementById("preview");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const detailBtn = document.getElementById("detailBtn");
const statusEl = document.getElementById("status");
const ttsAudio = document.getElementById("ttsAudio");

let stream = null;
let monitoring = false;
let wakeLock = null;
let isBusy = false;
let currentAudioUrl = null;

// Debounce state
let lastSpokenText = null;   // the hazard text we last actually spoke, or null when clear/silent
let consecutiveClearCount = 0;

// A tiny valid (silent) WAV — fallback only, in case the real confirmation
// clip below ever fails to load. Some WebKit versions hang forever on
// .play() with NO src at all, instead of properly rejecting.
const SILENT_AUDIO = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";

// Pre-generated "Monitoring started" clip, bundled as a static file so it
// plays instantly with no backend round trip — works even if the backend
// is still cold-starting right when someone needs it most. Also doubles as
// the iOS audio-unlock: playing this real clip inside the click handler
// unlocks this SAME <audio> element for later timer-triggered playback too.
const START_CONFIRMATION_AUDIO = "monitoring-started.mp3";

// Race any promise against a timeout so a hung native promise (seen on iOS
// with Wake Lock and empty-source audio) can never block the app forever.
function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("timed out")), ms))
  ]);
}

// --- Accessible triggers for "Describe Surroundings" ---
// A blind user can't aim for a small labeled button. Two gesture-based
// triggers work without needing to see or precisely target anything:
// shaking the device, and double-tapping ANYWHERE on the screen. The
// visible button stays too (handy for sighted testing/demoing) but is no
// longer the only way in.

let lastAcceleration = null;
let shakePeakTimes = [];       // timestamps of recent large jolts
let lastShakeTriggerTime = 0;
const SHAKE_DELTA_THRESHOLD = 18;   // tune against real-world walking jostle
const SHAKE_PEAK_WINDOW_MS = 800;   // peaks must land within this window of each other
const SHAKE_REQUIRED_PEAKS = 3;     // this many jolts in the window = a deliberate shake,
                                     // not a single bump from a curb or hard step
const SHAKE_COOLDOWN_MS = 2500;     // minimum gap between two separate shake triggers

function handleMotion(event) {
  const acc = event.accelerationIncludingGravity || event.acceleration;
  if (!acc || acc.x === null) return;

  if (lastAcceleration) {
    const delta =
      Math.abs(acc.x - lastAcceleration.x) +
      Math.abs(acc.y - lastAcceleration.y) +
      Math.abs(acc.z - lastAcceleration.z);

    const now = Date.now();

    if (delta > SHAKE_DELTA_THRESHOLD) {
      // A real shake is several sharp reversals in quick succession, not
      // one jolt — so require SHAKE_REQUIRED_PEAKS of them within the
      // window before treating it as intentional. Drop stale peaks first.
      shakePeakTimes = shakePeakTimes.filter(t => now - t < SHAKE_PEAK_WINDOW_MS);
      shakePeakTimes.push(now);

      if (
        shakePeakTimes.length >= SHAKE_REQUIRED_PEAKS &&
        now - lastShakeTriggerTime > SHAKE_COOLDOWN_MS &&
        monitoring
      ) {
        lastShakeTriggerTime = now;
        shakePeakTimes = [];
        describeOnDemand();
      }
    }
  }
  lastAcceleration = acc;
}

async function enableShakeTrigger() {
  if (typeof DeviceMotionEvent === "undefined") return;

  try {
    // iOS 13+ requires an explicit permission prompt, and it MUST be
    // requested inside a direct user gesture (same rule as everything
    // else on iOS we've already run into) — done here inside the Start
    // Monitoring click handler. Timeboxed defensively, same as the other
    // iOS permission prompts, in case it ever hangs instead of resolving.
    if (typeof DeviceMotionEvent.requestPermission === "function") {
      const result = await withTimeout(DeviceMotionEvent.requestPermission(), 3000);
      if (result !== "granted") return;
    }
    window.addEventListener("devicemotion", handleMotion);
  } catch (e) {
    console.warn("Motion permission unavailable:", e);
  }
}

let lastTapTime = 0;
const DOUBLE_TAP_MAX_GAP_MS = 450;

function handleGlobalTap(e) {
  // Ignore taps on actual buttons — those already have their own handlers.
  if (e.target.closest && e.target.closest("button")) return;

  if (!monitoring) {
    // Before monitoring starts, this is the ONLY thing a first tap needs to
    // do — no button to locate. A single tap anywhere on the blank starting
    // screen begins the walk.
    startMonitoring();
    return;
  }

  // Once already monitoring, require a double-tap (not single) so an
  // incidental brush against the screen while walking doesn't keep
  // triggering the detailed description.
  const now = Date.now();
  if (now - lastTapTime < DOUBLE_TAP_MAX_GAP_MS) {
    lastTapTime = 0;
    describeOnDemand();
  } else {
    lastTapTime = now;
  }
}
document.addEventListener("click", handleGlobalTap);

// Surface ANY error directly on-screen instead of failing silently,
// since we can't easily see the console on a phone.
window.addEventListener("error", (e) => {
  statusEl.textContent = "JS ERROR: " + e.message + " (line " + e.lineno + ")";
});
window.addEventListener("unhandledrejection", (e) => {
  const msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  statusEl.textContent = "PROMISE ERROR: " + msg;
});

async function playAudioBlob(audioBlob) {
  if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
  currentAudioUrl = URL.createObjectURL(audioBlob);
  ttsAudio.src = currentAudioUrl;
  await ttsAudio.play();
}

async function startMonitoring() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });
    video.srcObject = stream;

    // Play the "Monitoring started" confirmation. This MUST happen
    // synchronously inside this direct click handler (a real user gesture)
    // — Safari then allows this SAME <audio> element to be played later
    // from timers too. This also gives audible confirmation the tap
    // actually worked, which matters a lot when the person can't see the
    // status text change.
    try {
      ttsAudio.src = START_CONFIRMATION_AUDIO;
      await withTimeout(ttsAudio.play(), 2000);
    } catch (e) {
      console.warn("Start confirmation audio failed, falling back to silent unlock:", e);
      try {
        ttsAudio.src = SILENT_AUDIO;
        ttsAudio.muted = true;
        await withTimeout(ttsAudio.play(), 1500);
        ttsAudio.pause();
        ttsAudio.currentTime = 0;
        ttsAudio.muted = false;
      } catch (e2) {
        console.warn("Silent-audio unlock fallback also failed:", e2);
      }
    }

    // Ask for motion permission in the same user gesture as everything
    // else, so shake-to-describe works for the rest of the session.
    await enableShakeTrigger();

    // Reset debounce state on every fresh start
    lastSpokenText = null;
    consecutiveClearCount = 0;

    // Flip UI + start the loop FIRST. Wake Lock is best-effort and iOS
    // Safari has a known bug where this promise can hang forever without
    // ever resolving or rejecting — never let it block startup.
    startBtn.style.display = "none";
    stopBtn.style.display = "inline-block";
    detailBtn.style.display = "inline-block";
    statusEl.textContent = "Monitoring...";

    monitoring = true;
    runLoop(); // fire and forget — runs until monitoring is set false

    if (navigator.wakeLock) {
      navigator.wakeLock.request("screen")
        .then(lock => { wakeLock = lock; })
        .catch(e => console.warn("Wake Lock not available:", e));
    }
  } catch (err) {
    statusEl.textContent = "Camera access failed: " + err.message;
  }
}

function stopMonitoring() {
  monitoring = false;
  if (stream) stream.getTracks().forEach(track => track.stop());
  if (wakeLock) wakeLock.release();
  startBtn.style.display = "inline-block";
  stopBtn.style.display = "none";
  detailBtn.style.display = "none";
  statusEl.textContent = "Stopped";
}

function captureFrameBlob(maxDim) {
  return new Promise((resolve, reject) => {
    if (!video.videoWidth || !video.videoHeight) {
      reject(new Error("camera not ready"));
      return;
    }
    const scale = Math.min(1, maxDim / Math.max(video.videoWidth, video.videoHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(blob => {
      if (!blob) reject(new Error("frame capture failed"));
      else resolve(blob);
    }, "image/jpeg", 0.7);
  });
}

// Runs capture+classify back-to-back for as long as monitoring is true,
// padded up to MIN_LOOP_GAP_MS between ticks but never waiting longer than
// that — so the loop runs as fast as the backend actually responds instead
// of always waiting a fixed interval regardless of round-trip time.
async function runLoop() {
  while (monitoring) {
    const tickStart = performance.now();
    await captureAndClassify();
    const elapsed = performance.now() - tickStart;
    const remaining = MIN_LOOP_GAP_MS - elapsed;
    if (remaining > 0) {
      await new Promise(r => setTimeout(r, remaining));
    }
  }
}

// Continuous loop tick: cheap text-only classification, then decide
// client-side whether this is worth actually speaking.
async function captureAndClassify() {
  if (isBusy) return;
  isBusy = true;

  try {
    let blob;
    try {
      blob = await captureFrameBlob(LOOP_CAPTURE_MAX_DIM);
    } catch (e) {
      statusEl.textContent = "Waiting for camera...";
      return;
    }

    const formData = new FormData();
    formData.append("photo", blob, "frame.jpg");

    const response = await fetch(CLASSIFY_URL, { method: "POST", body: formData });
    if (!response.ok) throw new Error("Backend error: " + response.status);

    const { description } = await response.json();
    const isHazard = description.trim().toUpperCase() !== "CLEAR";

    if (isHazard) {
      consecutiveClearCount = 0;

      // Only speak if this is a genuinely new/changed hazard, not a repeat
      // of the exact thing we already just said.
      if (description !== lastSpokenText) {
        lastSpokenText = description;
        statusEl.textContent = "Hazard: " + description;
        const speakForm = new FormData();
        speakForm.append("text", description);
        const speakResponse = await fetch(SPEAK_URL, { method: "POST", body: speakForm });
        if (speakResponse.ok) {
          const audioBlob = await speakResponse.blob();
          await playAudioBlob(audioBlob);
        }
      }
    } else {
      consecutiveClearCount++;
      if (consecutiveClearCount >= DISENGAGE_THRESHOLD) {
        // Re-arm: if the same hazard shows up again later, it's worth
        // announcing again.
        lastSpokenText = null;
      }
      statusEl.textContent = "Monitoring... (clear)";
    }
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
  } finally {
    isBusy = false;
  }
}

// On-demand: explicit tap always speaks immediately, bypassing debounce.
async function describeOnDemand() {
  if (isBusy) {
    statusEl.textContent = "Busy, try again in a moment...";
    return;
  }
  isBusy = true;
  statusEl.textContent = "Describing surroundings...";
  // Best-effort acknowledgment that the gesture registered. iOS Safari
  // doesn't support the Vibration API at all (silently no-ops), but this
  // gives Android users instant confirmation while the request is in flight.
  if (navigator.vibrate) navigator.vibrate(80);

  try {
    const blob = await captureFrameBlob(DETAIL_CAPTURE_MAX_DIM);
    const formData = new FormData();
    formData.append("photo", blob, "frame.jpg");

    const response = await fetch(DETAILED_URL, { method: "POST", body: formData });
    if (!response.ok) throw new Error("Backend error: " + response.status);

    const audioBlob = await response.blob();
    await playAudioBlob(audioBlob);

    statusEl.textContent = "Monitoring...";
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
  } finally {
    isBusy = false;
  }
}

startBtn.addEventListener("click", startMonitoring);
stopBtn.addEventListener("click", stopMonitoring);
detailBtn.addEventListener("click", describeOnDemand);
</script>

</body>
</html>
