<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Walk-Assist Cane</title>
<style>
  body { font-family: -apple-system, sans-serif; text-align: center; background: #111; color: #fff; margin: 0; padding: 20px; }
  video { width: 100%; max-width: 400px; border-radius: 12px; }
  button { font-size: 20px; padding: 16px 32px; margin-top: 20px; border-radius: 12px; border: none; }
  #startBtn { background: #2ecc71; color: white; }
  #stopBtn { background: #e74c3c; color: white; }
  #status { margin-top: 16px; font-size: 16px; color: #aaa; }
</style>
</head>
<body>

<video id="preview" autoplay playsinline muted></video>
<br />
<button id="startBtn">Start Monitoring</button>
<button id="stopBtn" style="display:none;">Stop</button>
<div id="status">Not started</div>
<audio id="ttsAudio" style="display:none;"></audio>

<script>
const BACKEND_URL = "https://icane-hophacks-2026.onrender.com/describe";
const CAPTURE_INTERVAL_MS = 2000;

const video = document.getElementById("preview");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const statusEl = document.getElementById("status");
const ttsAudio = document.getElementById("ttsAudio");

let stream = null;
let loopTimer = null;
let wakeLock = null;
let isBusy = false;
let currentAudioUrl = null;

// Surface ANY error directly on-screen instead of failing silently,
// since we can't easily see the console on a phone.
window.addEventListener("error", (e) => {
  statusEl.textContent = "JS ERROR: " + e.message + " (line " + e.lineno + ")";
});
window.addEventListener("unhandledrejection", (e) => {
  const msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  statusEl.textContent = "PROMISE ERROR: " + msg;
});

async function startMonitoring() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });
    video.srcObject = stream;

    // Unlock audio playback for iOS Safari. This MUST happen synchronously
    // inside this direct click handler (a real user gesture) — Safari then
    // allows this SAME <audio> element to be played later from timers too.
    try {
      ttsAudio.muted = true;
      await ttsAudio.play();
      ttsAudio.pause();
      ttsAudio.currentTime = 0;
      ttsAudio.muted = false;
    } catch (e) {
      console.warn("Audio unlock failed:", e);
    }

    try {
      wakeLock = await navigator.wakeLock.request("screen");
    } catch (e) {
      console.warn("Wake Lock not available:", e);
    }

    startBtn.style.display = "none";
    stopBtn.style.display = "inline-block";
    statusEl.textContent = "Monitoring...";

    loopTimer = setInterval(captureAndSend, CAPTURE_INTERVAL_MS);
  } catch (err) {
    statusEl.textContent = "Camera access failed: " + err.message;
  }
}

function stopMonitoring() {
  clearInterval(loopTimer);
  if (stream) stream.getTracks().forEach(track => track.stop());
  if (wakeLock) wakeLock.release();
  startBtn.style.display = "inline-block";
  stopBtn.style.display = "none";
  statusEl.textContent = "Stopped";
}

async function captureAndSend() {
  if (isBusy) return;

  // Video metadata (dimensions) can take an extra beat to arrive on iOS.
  // Skip this tick rather than capturing a 0x0 frame.
  if (!video.videoWidth || !video.videoHeight) {
    statusEl.textContent = "Waiting for camera...";
    return;
  }

  isBusy = true;
  statusEl.textContent = "Capturing...";

  try {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.8));

    if (!blob) {
      statusEl.textContent = "Frame capture failed, retrying...";
      isBusy = false;
      return;
    }

    const formData = new FormData();
    formData.append("photo", blob, "frame.jpg");

    const response = await fetch(BACKEND_URL, { method: "POST", body: formData });
    if (!response.ok) throw new Error("Backend error: " + response.status);

    const audioBlob = await response.blob();

    if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl = URL.createObjectURL(audioBlob);

    ttsAudio.src = currentAudioUrl;
    await ttsAudio.play();

    statusEl.textContent = "Monitoring...";
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
  } finally {
    isBusy = false;
  }
}

startBtn.addEventListener("click", startMonitoring);
stopBtn.addEventListener("click", stopMonitoring);
</script>

</body>
</html>
